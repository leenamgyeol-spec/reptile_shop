function legacyRender(){const a=$('#app');if(!S.go){a.innerHTML=`<div class=ttlscr><div>${Object.keys(SP).map(k=>art(k)).join('')}</div><h1>🦎 파충류 분양샵</h1><p class=sm>파충류를 입고해 건강하게 키우고, 알맞은 손님에게 분양하세요.<br>시작하면 사육장 3개와 1,000코인, 콘스네이크 한 마리를 드려요. 이름과 분양 가격은 내가 직접 정해요.</p><button class=pri style="font-size:18px;padding:12px 30px" onclick=start()>게임 시작</button></div>`;return}
a.innerHTML=`<header><button class=ph onclick=phone() aria-label="먹이 주문">📱${need()?'<i></i>':''}</button><b class=ttl>🦎 파충류 분양샵</b><span class=pl>${esc(S.nm)} ⭐${Math.round(S.rp)}</span><span class=co>🪙 ${fm(S.c)}</span><button onclick=resetG() aria-label="다시 시작" title="다시 시작">🔄</button><div class=ck id=ck aria-label="게임 시계"></div></header><main>${V[tab]()}</main><nav>${TABS.map(([k,e,n])=>`<button class="${k==tab?'on':''}" onclick="tab='${k}';render();scrollTo(0,0)"><span>${e}</span>${n}${k=='cu'&&S.cu.length?' ('+S.cu.length+')':''}</button>`).join('')}</nav>`;bindDrag();clk()}
const SN=['김','이','박','최','정','강','윤','한'],GN=['민수','지현','서연','도윤','하준','유진','태현','수아'];
const pickMo=sp=>{const m=SP[sp].m;let w=R()*m.reduce((a,x)=>a+x[3],0);for(let i=0;i<m.length;i++){w-=m[i][3];if(w<=0)return i}return 0};
const mo=r=>SP[r.sp].m[r.mo||0],price=r=>Math.round(SP[r.sp].p*1.7*mo(r)[1]*[1,1.15,1.3][['아기','청소년','성체'].indexOf(stg(r))]*(.7+.3*r.hp/100)/10)*10;
const why=(r,c)=>r.quarantine>S.gm?'검역 중':r.stress>65?'스트레스 안정 필요':r.hp<70?'건강 70% 이상 필요':r.fd<2?`섭식 확인 필요 (${r.fd}/2)`:c.bn&&r.per==='겁이 많음'?'초보자에겐 성격이 맞지 않아요':'';
function addCu(){if(S.cu.length>=4)return;const co=R()<.25;const ks=Object.keys(SP),ws=ks.map(k=>({일반:5,희귀:3,레어:1.5})[SP[k].r]);let w=R()*ws.reduce((a,b)=>a+b),k=ks[0];for(let i=0;i<ks.length;i++){w-=ws[i];if(w<=0){k=ks[i];break}}S.cu.push({id:S.cid++,nm:SN[Math.floor(R()*8)]+GN[Math.floor(R()*8)]+' 님',sp:k,bg:Math.round(SP[k].p*1.7*(.9+R()*1.1)*(1+S.rp/250)*(co?2.2:1)/10)*10,co,bn:!co&&R()<.5,ex:15})}
function sell(ci,ri,hg){const c=S.cu.find(x=>x.id==ci),r=S.rep.find(x=>x.id==ri);if(!c||!r)return;const w=why(r,c);if(w)return toast(w);let g=r.pr;if(g>c.bg){if(!hg||c.bg<g*.8)return toast('손님 예산을 넘어요');g=c.bg}const mk=price(r);S.c+=g;S.rev+=g;S.sold++;S.rp=cl(S.rp+(g>mk*1.4?-1:g<mk*.8?(r.hp>=90?3:2):(r.hp>=90?2:1)));S.rep=S.rep.filter(x=>x!=r);S.cu=S.cu.filter(x=>x!=c);delete AN[r.id];log(`${c.nm}에게 ${r.name}(${SP[r.sp].n}, ${mo(r)[0]})을(를) ${fm(g)}코인에 분양했어요.`);toast(`🤝 분양 완료! +${fm(g)}코인`);chk();sv();render()}
function vCu(){return `<h3>🧑‍🤝‍🧑 분양 상담</h3><p class=sm>평판 ⭐ ${Math.round(S.rp)} · 누적 분양 ${S.sold}마리 · 매출 🪙 ${fm(S.rev)}<br>분양 조건: 건강 70% 이상, 직접 먹이 섭취 2회 이상 확인. 초보 손님에겐 순한 개체를 권해요.</p><div class=grid>${S.cu.map(c=>{const s=SP[c.sp],ok=S.rep.filter(r=>r.sp==c.sp);return `<div class=card>${art(c.sp)}<h4>${esc(c.nm)} ${c.co?'<span class=pill style="background:#8a4fc4">수집가</span> ':''}${c.bn?'<span class=pill style="background:#d9822b">초보</span>':''}</h4><div class=sm>${s.n}을(를) 찾아요 · 예산 🪙 ${fm(c.bg)}</div>${bar(c.ex/15*100,'#e0a02b')}${ok.map(r=>{const w=why(r,c);return `<div class=fr><div><b>${esc(r.name)}</b> <span class=sm>${mo(r)[0]} · ${stg(r)} · ${r.per}</span><div class=sm>🪙 내 가격 ${fm(r.pr)} ${w?'· ⚠ '+w:''}</div></div>${r.pr<=c.bg?`<button class=pri ${w?'disabled':''} onclick="sell(${c.id},${r.id})">분양</button>`:`<button ${w||c.bg<r.pr*.8?'disabled':''} onclick="sell(${c.id},${r.id},1)">${c.bg<r.pr*.8?'예산 초과':'깎아서 '+fm(c.bg)}</button>`}</div>`}).join('')||'<div class=sm>재고가 없어요. 입고 탭에서 데려오세요.</div>'}</div>`}).join('')||'<p class=em>지금은 손님이 없어요. 잠시 기다려 보세요.</p>'}</div>`}
/* actions */
let ik;
function intake(sp,dn,btn,cb){const mi=pickMo(sp),am=(10+Math.floor(R()*10))/5*DAY,mp=price({sp,mo:mi,hp:100,am});ik={mi,am,cb};openM(`<div class=box>${art(sp,'',SP[sp].m[mi][2])}<h3>${SP[sp].n} · ${SP[sp].m[mi][0]}</h3><p class=sm>지금 시세는 약 🪙 ${fm(mp)}예요. 자라면서 시세가 오르고, 손님 예산보다 비싸면 안 팔려요.</p><div class=sm>이름</div><input id=in maxlength=12 value="${esc(dn)}"><div class=sm style="margin-top:8px">분양 가격 (코인)</div><input id=ip type=number min=10 step=10 value=${mp}><div class=row><button onclick=closeM()>취소</button><button class=pri onclick=ikOk()>${btn}</button></div></div>`)}
function ikOk(){const n=$('#in').value.trim(),p=Math.round(+$('#ip').value);if(!n)return toast('이름을 입력해 주세요');if(!(p>0))return toast('가격을 입력해 주세요');closeM();ik.cb(n,p,ik.mi,ik.am)}
function setPr(id){const r=S.rep.find(x=>x.id==id);openM(`<div class=box><h3>💰 ${esc(r.name)} 분양 가격</h3><p class=sm>현재 시세 약 🪙 ${fm(price(r))}</p><input id=ip type=number min=10 step=10 value=${r.pr}><div class=row><button onclick=closeM()>취소</button><button class=pri onclick=savePr(${id})>저장</button></div></div>`)}

function start(){ask('가게 이름을 지어 주세요',S.nm,n=>{S.nm=n;intake('corn','콘스-1','🦎 시작하기',(nm,pr,mi,am)=>{S.go=1;S.last=Date.now();addRep('corn',nm,1,am,pr,mi);sv();render()})})}
function phone(){openM(`<div class=phone><h3 style="text-align:center">📱 먹이 주문</h3><p class=sm style="text-align:center">보유 🪙 ${fm(S.c)} · 즉시 배송</p>${Object.entries(FOOD).map(([k,f])=>`<div class=fr><span class=fe>${f.e}</span><div><b>${f.n}</b><div class=sm>보유 ${S.inv[k]}개 · ${f.p}코인</div></div><button onclick="order('${k}',1)">+1</button><button onclick="order('${k}',5)">+5</button></div>`).join('')}<div class=row><button class=pri onclick=closeM()>닫기</button></div></div>`)}

function legacyFeed(id){const r=S.rep.find(x=>x.id==id),s=SP[r.sp];if(r.hg<25)return toast(`${r.name}은(는) 아직 배불러요`);if(!S.inv[s.f])return toast(`${FOOD[s.f].n}이(가) 없어요. 📱로 주문하세요`);fd={id,h:0};openM(`<div class=box><h3>🥢 핀셋 피딩</h3><p class=sm id=fm>핀셋을 끌어 쟁반의 먹이를 집은 뒤, ${esc(r.name)}의 입 앞으로 가져가세요.</p><div id=fs class=fs><div class=tray>${FOOD[s.f].e}</div><div class=tg>${art(r.sp)}</div><div id=tw class=tw>🥢</div></div><div class=row><button onclick="fd=null;closeM()">취소</button></div></div>`);bindTw()}
function bindTw(){const st=$('#fs'),tw=$('#tw'),r=S.rep.find(x=>x.id==fd.id),em=FOOD[SP[r.sp].f].e;let on=0,ox=0,oy=0;
tw.onpointerdown=ev=>{ev.preventDefault();on=1;tw.setPointerCapture(ev.pointerId);const b=tw.getBoundingClientRect();ox=ev.clientX-b.left;oy=ev.clientY-b.top};
tw.onpointermove=ev=>{if(!on||!fd)return;const sb=st.getBoundingClientRect(),x=cl(ev.clientX-sb.left-ox,0,sb.width-44),y=cl(ev.clientY-sb.top-oy,0,sb.height-44);tw.style.left=x+'px';tw.style.top=y+'px';const cx=x+22,cy=y+40;
if(!fd.h&&cx<115&&cy>st.clientHeight-85){fd.h=1;tw.innerHTML=`🥢<span class=hf>${em}</span>`;$('#fm').textContent='집었어요! 입 앞으로 천천히 가져가세요.'}
const tg=$('.tg').getBoundingClientRect();if(fd.h&&cx>tg.left-sb.left+tg.width*.6&&cy>tg.top-sb.top&&cy<tg.bottom-sb.top)feedDone()};
tw.onpointerup=tw.onpointercancel=()=>on=0}
